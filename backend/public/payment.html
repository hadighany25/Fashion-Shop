<!doctype html>
<html lang="km" class="bg-gray-50">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ទូទាត់ប្រាក់ - U-Mall</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Kantumruy Pro", sans-serif;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body class="text-gray-800 antialiased flex flex-col min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
      <div
        class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between"
      >
        <a href="index.html" class="flex items-center space-x-2">
          <div
            class="bg-blue-600 text-white px-3 py-1.5 rounded-lg font-bold text-xl leading-none shadow-sm"
          >
            <i class="fas fa-arrow-left text-sm mr-1"></i> U-Mall
          </div>
        </a>
        <div class="text-lg font-bold text-gray-700">ការទូទាត់ប្រាក់</div>
        <div class="w-16"></div>
      </div>
    </header>

    <main class="flex-grow max-w-5xl mx-auto px-4 py-8 w-full">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <!-- ផ្នែកខាងឆ្វេង៖ ជម្រើសទូទាត់ -->
        <div
          class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 h-fit"
        >
          <h2 class="text-xl font-bold text-gray-800 mb-6 flex items-center">
            <i class="fas fa-wallet text-blue-600 mr-3"></i>
            ជ្រើសរើសវិធីសាស្ត្រទូទាត់
          </h2>

          <!-- Payment Tabs -->
          <div class="flex space-x-2 mb-6 bg-gray-100 p-1 rounded-xl">
            <button
              id="tab-qr"
              onclick="switchTab('qr')"
              class="flex-1 py-2.5 rounded-lg font-medium text-sm transition-all bg-white shadow text-blue-600"
            >
              <i class="fas fa-qrcode mr-2"></i> U-Pay QR
            </button>
            <button
              id="tab-card"
              onclick="switchTab('card')"
              class="flex-1 py-2.5 rounded-lg font-medium text-sm transition-all text-gray-500 hover:text-gray-700"
            >
              <i class="fas fa-credit-card mr-2"></i> បង់តាមកាត
            </button>
          </div>

          <!-- QR Section -->
          <div id="qr-section" class="text-center">
            <div
              class="inline-block p-4 border-2 border-dashed border-blue-200 rounded-2xl bg-blue-50 mb-4 relative"
            >
              <img
                id="qr-img"
                src="https://via.placeholder.com/250x250?text=Generating+U-Pay+QR..."
                alt="U-Pay QR"
                class="w-48 h-48 md:w-56 md:h-56 object-cover rounded-xl"
              />
              <div
                id="qr-loading"
                class="absolute inset-0 bg-white/80 flex items-center justify-center rounded-xl"
              >
                <i class="fas fa-spinner fa-spin text-3xl text-blue-600"></i>
              </div>
            </div>
            <p class="text-sm text-gray-500 mb-6">
              ស្កេន QR ឬចុចប៊ូតុងខាងក្រោមដើម្បីបន្តទៅកាន់
              <span class="font-bold text-blue-600">U-Pay Bank</span>
            </p>

            <!-- ប្ដូរពណ៌ទៅជាពណ៌ខៀវ និងដាក់ Icon វ៉ិបសាយ -->
            <button
              id="btn-deeplink"
              onclick="openUPayBank()"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-md transition-all flex items-center justify-center gap-2 pointer-events-none opacity-50"
            >
              <i class="fas fa-external-link-alt text-lg"></i> បន្តទៅបង់ប្រាក់លើ
              U-Pay
            </button>
          </div>

          <!-- Card Section -->
          <div id="card-section" class="hidden">
            <div class="space-y-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1"
                  >លេខកាត (Card Number)</label
                >
                <div class="relative">
                  <input
                    type="text"
                    id="card-num"
                    placeholder="0000 0000 0000 0000"
                    maxlength="19"
                    class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all"
                  />
                  <i
                    class="fas fa-credit-card absolute left-3.5 top-3.5 text-gray-400"
                  ></i>
                </div>
              </div>
              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1"
                    >ថ្ងៃផុតកំណត់ (MM/YY)</label
                  >
                  <input
                    type="text"
                    id="card-exp"
                    placeholder="MM/YY"
                    maxlength="5"
                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all"
                  />
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1"
                    >លេខកូដ (CVV)</label
                  >
                  <input
                    type="password"
                    id="card-cvv"
                    placeholder="123"
                    maxlength="3"
                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all"
                  />
                </div>
              </div>
              <button
                onclick="processCardPayment()"
                class="w-full mt-4 bg-gray-800 hover:bg-black text-white font-bold py-3.5 rounded-xl shadow-md transition-all flex items-center justify-center gap-2"
              >
                <i class="fas fa-lock text-sm"></i> បញ្ជាក់ការបង់ប្រាក់
              </button>
            </div>
          </div>

          <div id="payment-status" class="mt-8 text-center hidden">
            <span
              class="inline-flex items-center px-4 py-2 rounded-full text-sm font-medium bg-yellow-100 text-yellow-800"
            >
              <i class="fas fa-circle-notch fa-spin mr-2"></i>
              កំពុងរង់ចាំការទូទាត់...
            </span>
          </div>
        </div>

        <!-- ផ្នែកខាងស្ដាំ៖ សង្ខេបការបញ្ជាទិញ -->
        <div
          class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 h-fit flex flex-col max-h-[80vh]"
        >
          <h2
            class="text-xl font-bold text-gray-800 mb-4 pb-4 border-b border-gray-100"
          >
            សង្ខេបការបញ្ជាទិញ
            <span
              class="text-sm font-normal text-gray-500 float-right pt-1"
              id="display-order-id"
              >#ORD-...</span
            >
          </h2>

          <!-- បញ្ជីទំនិញ -->
          <div
            id="order-items"
            class="flex-1 overflow-y-auto pr-2 space-y-3 mb-6 no-scrollbar"
          >
            <!-- JS នឹងគូរទំនិញនៅទីនេះ -->
          </div>

          <!-- ផ្នែកសរុបប្រាក់ -->
          <div class="border-t border-gray-100 pt-4 space-y-2">
            <div class="flex justify-between text-gray-600">
              <span>សរុបទំនិញ</span>
              <span id="sub-total">$0.00</span>
            </div>
            <div class="flex justify-between text-gray-600">
              <span>សេវាដឹកជញ្ជូន</span>
              <span id="shipping-fee">$1.50</span>
            </div>
            <div class="flex justify-between items-end pt-2">
              <span class="text-lg font-bold text-gray-800">ទឹកប្រាក់សរុប</span>
              <span id="total-amount" class="text-2xl font-bold text-blue-600"
                >$0.00</span
              >
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>
      let currentOrderId = "ORD-" + Math.floor(100000 + Math.random() * 900000);
      let currentTotal = 0;
      let uPayWebLink = ""; // ប្តូរពី mockUPayLink មក uPayWebLink

      document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("display-order-id").innerText = currentOrderId;

        if (
          !localStorage.getItem("umall_cart") ||
          JSON.parse(localStorage.getItem("umall_cart")).length === 0
        ) {
          localStorage.setItem(
            "umall_cart",
            JSON.stringify([
              {
                name: "អាវយឺតដៃខ្លីម៉ូដថ្មី",
                price: 15.0,
                qty: 1,
                image:
                  "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=100&q=80",
              },
              {
                name: "ខោខូវប៊យបុរស",
                price: 25.5,
                qty: 2,
                image:
                  "https://images.unsplash.com/photo-1542272604-787c3835535d?w=100&q=80",
              },
            ]),
          );
        }

        renderOrderList();

        const cardNum = document.getElementById("card-num");
        const cardExp = document.getElementById("card-exp");
        const cardCvv = document.getElementById("card-cvv");

        cardNum.addEventListener("input", function (e) {
          let val = e.target.value.replace(/[^\d]/g, "");
          e.target.value = val.replace(/(.{4})/g, "$1 ").trim();
          if (e.target.value.length === 19) {
            cardExp.focus();
          }
        });

        cardExp.addEventListener("input", function (e) {
          let val = e.target.value.replace(/[^\d]/g, "");
          if (val.length >= 2) {
            val = val.substring(0, 2) + "/" + val.substring(2, 4);
          }
          e.target.value = val;
          if (e.target.value.length === 5) {
            cardCvv.focus();
          }
        });
      });

      function switchTab(type) {
        const btnQr = document.getElementById("tab-qr");
        const btnCard = document.getElementById("tab-card");
        if (type === "qr") {
          document.getElementById("qr-section").classList.remove("hidden");
          document.getElementById("card-section").classList.add("hidden");
          btnQr.className =
            "flex-1 py-2.5 rounded-lg font-medium text-sm transition-all bg-white shadow text-blue-600";
          btnCard.className =
            "flex-1 py-2.5 rounded-lg font-medium text-sm transition-all text-gray-500 hover:text-gray-700";
        } else {
          document.getElementById("qr-section").classList.add("hidden");
          document.getElementById("card-section").classList.remove("hidden");
          btnCard.className =
            "flex-1 py-2.5 rounded-lg font-medium text-sm transition-all bg-white shadow text-gray-800 border border-gray-200";
          btnQr.className =
            "flex-1 py-2.5 rounded-lg font-medium text-sm transition-all text-gray-500 hover:text-gray-700";
        }
      }

      function updateQty(index, change) {
        let cart = JSON.parse(localStorage.getItem("umall_cart")) || [];
        if (cart[index]) {
          cart[index].qty += change;
          if (cart[index].qty <= 0) {
            cart.splice(index, 1);
          }
          localStorage.setItem("umall_cart", JSON.stringify(cart));
          renderOrderList();
        }
      }

      function removeItem(index) {
        let cart = JSON.parse(localStorage.getItem("umall_cart")) || [];
        cart.splice(index, 1);
        localStorage.setItem("umall_cart", JSON.stringify(cart));
        renderOrderList();
      }

      function renderOrderList() {
        let cart = JSON.parse(localStorage.getItem("umall_cart")) || [];
        const itemsContainer = document.getElementById("order-items");

        if (cart.length === 0) {
          window.location.href = "index.html";
          return;
        }

        let subTotal = 0;
        itemsContainer.innerHTML = cart
          .map((item, index) => {
            subTotal += item.price * item.qty;
            const imgUrl =
              item.image || "https://via.placeholder.com/100?text=No+Image";

            return `
            <div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl border border-gray-100 hover:shadow-sm transition-all">
                <div class="flex items-center flex-1 gap-3 overflow-hidden">
                    <img src="${imgUrl}" alt="Product" class="w-12 h-12 rounded-lg object-cover border border-gray-200 shadow-sm flex-shrink-0" />
                    <div class="flex-1 min-w-0">
                        <div class="font-bold text-gray-800 text-sm truncate">${item.name}</div>
                        <div class="text-xs text-blue-600 mt-0.5 font-medium">$${item.price.toFixed(2)}</div>
                    </div>
                </div>
                <div class="flex items-center space-x-2 ml-3">
                    <button onclick="updateQty(${index}, -1)" class="w-7 h-7 rounded-full bg-white border border-gray-200 flex items-center justify-center text-gray-600 hover:bg-gray-100 active:bg-gray-200">-</button>
                    <span class="text-sm font-bold w-4 text-center text-gray-800">${item.qty}</span>
                    <button onclick="updateQty(${index}, 1)" class="w-7 h-7 rounded-full bg-white border border-gray-200 flex items-center justify-center text-gray-600 hover:bg-gray-100 active:bg-gray-200">+</button>
                    <button onclick="removeItem(${index})" class="ml-2 w-8 h-8 rounded-lg flex items-center justify-center text-red-400 hover:text-red-600 hover:bg-red-50 transition-colors">
                        <i class="fas fa-trash-alt text-sm"></i>
                    </button>
                </div>
            </div>`;
          })
          .join("");

        document.getElementById("sub-total").innerText =
          "$" + subTotal.toFixed(2);
        currentTotal = subTotal + 1.5;
        document.getElementById("total-amount").innerText =
          "$" + currentTotal.toFixed(2);

        requestUPayQR();
      }

      function requestUPayQR() {
        document.getElementById("qr-loading").classList.remove("hidden");
        document
          .getElementById("btn-deeplink")
          .classList.add("pointer-events-none", "opacity-50");

        setTimeout(() => {
          document.getElementById("qr-loading").classList.add("hidden");

          // ប្រើ Link វ៉ិបសាយ U-Pay Bank របស់បង!
          uPayWebLink = `https://u-pay-bank.fly.dev/transfer.html?amount=${currentTotal}&merchant=UMALL&orderId=${currentOrderId}`;

          // បង្កើត QR Code អោយស្កេនលោតចូល Web តែម្តង
          document.getElementById("qr-img").src =
            `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(uPayWebLink)}&color=2563EB`; // ពណ៌ខៀវដូច U-Pay

          const btnLink = document.getElementById("btn-deeplink");
          btnLink.classList.remove("pointer-events-none", "opacity-50");
          document.getElementById("payment-status").classList.remove("hidden");
        }, 800);
      }

      function openUPayBank() {
        if (uPayWebLink) {
          // បើក Tab ថ្មី ទៅកាន់វ៉ិបសាយ U-Pay Bank របស់បង
          window.open(uPayWebLink, "_blank");
          // (បើចង់អោយវាបើកជាន់ពីលើទំព័រនេះតែម្តង សូមប្រើ window.location.href = uPayWebLink; )
        }
      }

      function processCardPayment() {
        const cardNum = document
          .getElementById("card-num")
          .value.replace(/\s/g, "");
        if (cardNum.length < 16) {
          return Swal.fire(
            "ព័ត៌មានមិនគ្រប់គ្រាន់",
            "សូមបញ្ជាក់លេខកាតឱ្យបានត្រឹមត្រូវ",
            "warning",
          );
        }
        Swal.fire({
          title: "កំពុងដំណើរការ...",
          text: "កំពុងភ្ជាប់ទៅកាន់ប្រព័ន្ធធនាគារ",
          allowOutsideClick: false,
          didOpen: () => Swal.showLoading(),
        });

        setTimeout(() => {
          Swal.fire({
            icon: "success",
            title: "ជោគជ័យ",
            text: "ការទូទាត់ទទួលបានជោគជ័យ!",
            timer: 2000,
            showConfirmButton: false,
          }).then(() => {
            localStorage.setItem("umall_cart", "[]");
            window.location.href = "index.html";
          });
        }, 2000);
      }
    </script>
  </body>
</html>
