<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | Fashion Shop</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
      :root {
        --sidebar-bg: #0f172a;
        --main-bg: #1e293b;
        --card-bg: #334155;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --accent: #0284c7;
        --accent-hover: #0369a1;
        --danger: #ef4444;
        --success: #10b981;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "DM Sans", sans-serif;
      }

      body {
        display: flex;
        height: 100vh;
        background-color: var(--main-bg);
        color: var(--text-main);
        overflow: hidden;
      }

      /* Sidebar Styles */
      .sidebar {
        width: 260px;
        background-color: var(--sidebar-bg);
        padding: 20px 0;
        display: flex;
        flex-direction: column;
        border-right: 1px solid #1e293b;
      }
      .sidebar-logo {
        font-size: 1.5rem;
        font-weight: 700;
        text-align: center;
        margin-bottom: 30px;
        color: var(--text-main);
      }
      .sidebar-logo span {
        color: var(--accent);
      }
      .nav-menu {
        list-style: none;
        flex: 1;
      }
      .nav-menu li {
        margin-bottom: 5px;
      }
      .nav-menu a {
        display: flex;
        align-items: center;
        padding: 15px 25px;
        color: var(--text-muted);
        text-decoration: none;
        transition: 0.3s;
        gap: 15px;
      }
      .nav-menu a:hover,
      .nav-menu a.active {
        background-color: rgba(2, 132, 199, 0.1);
        color: var(--text-main);
        border-right: 4px solid var(--accent);
      }
      .logout-btn {
        margin: 20px;
        padding: 12px;
        background-color: var(--danger);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.3s;
      }
      .logout-btn:hover {
        background-color: #dc2626;
      }

      /* Main Content Styles */
      .main-content {
        flex: 1;
        overflow-y: auto;
        padding: 30px;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
      }
      .header h1 {
        font-size: 1.8rem;
      }
      .admin-profile {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      /* Stats Cards */
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 40px;
      }
      .stat-card {
        background-color: var(--card-bg);
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .stat-icon {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background-color: rgba(2, 132, 199, 0.2);
        color: var(--accent);
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 1.5rem;
      }
      .stat-info h3 {
        font-size: 1.5rem;
      }
      .stat-info p {
        color: var(--text-muted);
        font-size: 0.9rem;
      }

      /* Create Seller Section */
      .action-section {
        background-color: var(--card-bg);
        padding: 25px;
        border-radius: 12px;
        margin-bottom: 30px;
      }
      .action-section h2 {
        margin-bottom: 20px;
        font-size: 1.3rem;
        border-bottom: 1px solid #475569;
        padding-bottom: 10px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr auto;
        gap: 15px;
        align-items: end;
      }
      .input-group {
        display: flex;
        flex-direction: column;
      }
      .input-group label {
        margin-bottom: 8px;
        font-size: 0.9rem;
        color: var(--text-muted);
      }
      .input-group input,
      .input-group select {
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #475569;
        background-color: var(--main-bg);
        color: white;
        outline: none;
      }
      .btn-primary {
        padding: 12px 25px;
        background-color: var(--accent);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        height: 45px;
      }
      .btn-primary:hover {
        background-color: var(--accent-hover);
      }

      /* Data Table */
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
      }
      th,
      td {
        padding: 15px;
        text-align: left;
        border-bottom: 1px solid #475569;
      }
      th {
        color: var(--text-muted);
        font-weight: 500;
      }
      .badge {
        padding: 5px 10px;
        border-radius: 20px;
        font-size: 0.8rem;
        font-weight: bold;
        text-transform: capitalize;
      }
      .badge.admin {
        background-color: rgba(239, 68, 68, 0.2);
        color: var(--danger);
      }
      .badge.seller {
        background-color: rgba(16, 185, 129, 0.2);
        color: var(--success);
      }
      .badge.buyer {
        background-color: rgba(148, 163, 184, 0.2);
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <i class="fas fa-crown"></i> <span>Admin</span>Panel
      </div>
      <ul class="nav-menu">
        <li>
          <a href="#" class="active"
            ><i class="fas fa-chart-line"></i> Dashboard</a
          >
        </li>
        <li>
          <a href="#"><i class="fas fa-users"></i> Manage Users</a>
        </li>
        <li>
          <a href="#"><i class="fas fa-box"></i> All Products</a>
        </li>
        <li>
          <a href="#"><i class="fas fa-shopping-cart"></i> Orders</a>
        </li>
        <li>
          <a href="#"><i class="fas fa-cog"></i> Settings</a>
        </li>
      </ul>
      <button class="logout-btn" onclick="handleLogout()">
        <i class="fas fa-sign-out-alt"></i> Logout
      </button>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="header">
        <h1>Dashboard Overview</h1>
        <div class="admin-profile">
          <i class="fas fa-user-circle fa-2x text-muted"></i>
          <span id="admin-name">Admin User</span>
        </div>
      </header>

      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-users"></i></div>
          <div class="stat-info">
            <h3 id="stat-total-users">0</h3>
            <p>Total Users</p>
          </div>
        </div>
        <div class="stat-card">
          <div
            class="stat-icon"
            style="color: var(--success); background: rgba(16, 185, 129, 0.2)"
          >
            <i class="fas fa-store"></i>
          </div>
          <div class="stat-info">
            <h3 id="stat-total-sellers">0</h3>
            <p>Active Sellers</p>
          </div>
        </div>
        <div class="stat-card">
          <div
            class="stat-icon"
            style="color: #f59e0b; background: rgba(245, 158, 11, 0.2)"
          >
            <i class="fas fa-box-open"></i>
          </div>
          <div class="stat-info">
            <h3 id="stat-total-products">3,420</h3>
            <p>Total Products (Mock)</p>
          </div>
        </div>
      </div>

      <!-- Create New Seller / Admin -->
      <section class="action-section">
        <h2><i class="fas fa-user-plus"></i> Create System Account</h2>
        <form
          id="createAccountForm"
          class="form-grid"
          onsubmit="
            event.preventDefault();
            createSystemAccount();
          "
        >
          <div class="input-group">
            <label>Username</label>
            <input
              type="text"
              id="new-username"
              required
              placeholder="Enter username"
            />
          </div>
          <div class="input-group">
            <label>Password</label>
            <input
              type="password"
              id="new-password"
              required
              placeholder="Enter password"
            />
          </div>
          <div class="input-group">
            <label>Role</label>
            <select id="new-role">
              <option value="seller">Seller</option>
              <option value="admin">Administrator</option>
              <option value="buyer">Buyer</option>
            </select>
          </div>
          <button type="submit" class="btn-primary">
            <i class="fas fa-plus"></i> Create Account
          </button>
        </form>
      </section>

      <!-- User List Table -->
      <section class="action-section">
        <h2><i class="fas fa-list"></i> System Users List</h2>
        <table>
          <thead>
            <tr>
              <th>Username</th>
              <th>Role</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="user-table-body">
            <!-- Data loaded dynamically via JS -->
          </tbody>
        </table>
      </section>
    </main>

    <script>
      // ==========================================
      // 1. បង្កើតទិន្នន័យសិប្បនិម្មិត (Mock Setup) ដើម្បីកុំឲ្យ Error ពេលអត់ Backend
      // ==========================================
      if (!localStorage.getItem("token")) {
        // បើអត់ទាន់ Login ទេ យើងបង្ខំឲ្យមានសិទ្ធិ Admin ទីនេះដើម្បីងាយស្រួលតេស្ត
        localStorage.setItem("token", "fake-jwt-token-for-frontend");
        localStorage.setItem("role", "admin");
        localStorage.setItem("username", "super_admin");
      }

      const TOKEN = localStorage.getItem("token");
      const ROLE = localStorage.getItem("role");
      const USERNAME = localStorage.getItem("username");

      // បង្កើតទិន្នន័យ Users ចោលក្នុង LocalStorage បើមិនទាន់មាន
      if (!localStorage.getItem("db_users")) {
        const defaultUsers = [
          { _id: "1", username: "super_admin", role: "admin" },
          { _id: "2", username: "fashion_seller_1", role: "seller" },
          { _id: "3", username: "normal_buyer", role: "buyer" },
        ];
        localStorage.setItem("db_users", JSON.stringify(defaultUsers));
      }

      // ==========================================
      // 2. ពិនិត្យសិទ្ធិ និងដំណើរការកម្មវិធី
      // ==========================================
      document.addEventListener("DOMContentLoaded", () => {
        if (!TOKEN || ROLE !== "admin") {
          Swal.fire({
            icon: "error",
            title: "Access Denied",
            text: "You do not have permission to view this page.",
            allowOutsideClick: false,
          }).then(() => {
            window.location.href = "admin-login.html";
          });
        } else {
          document.getElementById("admin-name").innerText = USERNAME;
          loadDashboardData();
        }
      });

      // ==========================================
      // 3. ទាញទិន្នន័យមកបង្ហាញ (លែងពឹង Backend សិន)
      // ==========================================
      function loadDashboardData() {
        // ទាញទិន្នន័យចេញពី LocalStorage
        const users = JSON.parse(localStorage.getItem("db_users")) || [];

        // គណនាសរុប
        const totalUsers = users.length;
        const totalSellers = users.filter((u) => u.role === "seller").length;

        document.getElementById("stat-total-users").innerText = totalUsers;
        document.getElementById("stat-total-sellers").innerText = totalSellers;

        // បង្ហាញចូលក្នុង Table
        const tbody = document.getElementById("user-table-body");
        tbody.innerHTML = users
          .map(
            (u) => `
          <tr>
            <td>${u.username}</td>
            <td><span class="badge ${u.role}">${u.role}</span></td>
            <td>Active</td>
            <td>
              ${
                u.username === USERNAME
                  ? `<button disabled style="background:none;border:none;color:gray;cursor:not-allowed;"><i class="fas fa-ban"></i></button>`
                  : `<button onclick="deleteUser('${u._id}', '${u.username}')" style="background:none;border:none;color:var(--danger);cursor:pointer;"><i class="fas fa-trash"></i></button>`
              }
            </td>
          </tr>
        `,
          )
          .join("");
      }

      // ==========================================
      // 4. បង្កើតគណនីថ្មីបញ្ចូលទៅ LocalStorage
      // ==========================================
      function createSystemAccount() {
        const usernameInput = document
          .getElementById("new-username")
          .value.trim();
        const roleInput = document.getElementById("new-role").value;

        let users = JSON.parse(localStorage.getItem("db_users")) || [];

        // ឆែកមើលថាតើមានឈ្មោះនេះរួចហើយឬនៅ
        const exists = users.find(
          (u) => u.username.toLowerCase() === usernameInput.toLowerCase(),
        );
        if (exists) {
          Swal.fire("Failed", "Username already exists!", "error");
          return;
        }

        // បង្កើត Object User ថ្មី
        const newUser = {
          _id: Date.now().toString(), // បង្កើត ID ស្វ័យប្រវត្តិ
          username: usernameInput,
          role: roleInput,
        };

        // រក្សាទុកក្នុង LocalStorage
        users.push(newUser);
        localStorage.setItem("db_users", JSON.stringify(users));

        Swal.fire(
          "Created!",
          `${usernameInput} has been created as ${roleInput}.`,
          "success",
        );
        document.getElementById("createAccountForm").reset();
        loadDashboardData(); // Refresh table
      }

      // ==========================================
      // 5. លុបគណនីចេញពី LocalStorage
      // ==========================================
      function deleteUser(userId, username) {
        Swal.fire({
          title: `Delete ${username}?`,
          text: "This action cannot be undone!",
          icon: "warning",
          showCancelButton: true,
          confirmButtonColor: "#ef4444",
          cancelButtonColor: "#94a3b8",
          confirmButtonText: "Yes, delete",
        }).then((result) => {
          if (result.isConfirmed) {
            let users = JSON.parse(localStorage.getItem("db_users")) || [];

            // ចម្រាញ់យកតែទិន្នន័យណាដែលមិនមែនជា ID ដែលចង់លុប
            users = users.filter((u) => u._id !== userId);

            // Save ចូល LocalStorage វិញ
            localStorage.setItem("db_users", JSON.stringify(users));

            Swal.fire("Deleted!", "User has been deleted.", "success");
            loadDashboardData(); // Refresh table
          }
        });
      }

      // ==========================================
      // 6. មុខងារ Logout
      // ==========================================
      function handleLogout() {
        Swal.fire({
          title: "Are you sure?",
          text: "You will be logged out of the admin panel.",
          icon: "warning",
          showCancelButton: true,
          confirmButtonColor: "#0284c7",
          cancelButtonColor: "#ef4444",
          confirmButtonText: "Yes, logout!",
        }).then((result) => {
          if (result.isConfirmed) {
            localStorage.removeItem("token");
            localStorage.removeItem("role");
            localStorage.removeItem("username");
            // បើចង់លុបទិន្នន័យ Mock ចោលពេល Logout អាចថែម: localStorage.removeItem("db_users");
            window.location.href = "admin-login.html";
          }
        });
      }
    </script>
  </body>
</html>
