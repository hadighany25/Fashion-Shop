<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | Fashion Shop</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
      :root {
        --sidebar-bg: #0f172a;
        --main-bg: #1e293b;
        --card-bg: #334155;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --accent: #0284c7;
        --accent-hover: #0369a1;
        --danger: #ef4444;
        --success: #10b981;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "DM Sans", sans-serif;
      }

      body {
        display: flex;
        height: 100vh;
        background-color: var(--main-bg);
        color: var(--text-main);
        overflow: hidden;
      }

      /* Sidebar Styles */
      .sidebar {
        width: 260px;
        background-color: var(--sidebar-bg);
        padding: 20px 0;
        display: flex;
        flex-direction: column;
        border-right: 1px solid #1e293b;
      }
      .sidebar-logo {
        font-size: 1.5rem;
        font-weight: 700;
        text-align: center;
        margin-bottom: 30px;
        color: var(--text-main);
      }
      .sidebar-logo span {
        color: var(--accent);
      }
      .nav-menu {
        list-style: none;
        flex: 1;
      }
      .nav-menu li {
        margin-bottom: 5px;
      }
      .nav-menu a {
        display: flex;
        align-items: center;
        padding: 15px 25px;
        color: var(--text-muted);
        text-decoration: none;
        transition: 0.3s;
        gap: 15px;
      }
      .nav-menu a:hover,
      .nav-menu a.active {
        background-color: rgba(2, 132, 199, 0.1);
        color: var(--text-main);
        border-right: 4px solid var(--accent);
      }
      .logout-btn {
        margin: 20px;
        padding: 12px;
        background-color: var(--danger);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.3s;
      }
      .logout-btn:hover {
        background-color: #dc2626;
      }

      /* Main Content Styles */
      .main-content {
        flex: 1;
        overflow-y: auto;
        padding: 30px;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
      }
      .header h1 {
        font-size: 1.8rem;
      }
      .admin-profile {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      /* Stats Cards */
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 40px;
      }
      .stat-card {
        background-color: var(--card-bg);
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .stat-icon {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background-color: rgba(2, 132, 199, 0.2);
        color: var(--accent);
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 1.5rem;
      }
      .stat-info h3 {
        font-size: 1.5rem;
      }
      .stat-info p {
        color: var(--text-muted);
        font-size: 0.9rem;
      }

      /* Action Section & Form */
      .action-section {
        background-color: var(--card-bg);
        padding: 25px;
        border-radius: 12px;
        margin-bottom: 30px;
      }
      .action-section h2 {
        margin-bottom: 20px;
        font-size: 1.3rem;
        border-bottom: 1px solid #475569;
        padding-bottom: 10px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
        align-items: end;
      }
      .input-group {
        display: flex;
        flex-direction: column;
      }
      .input-group label {
        margin-bottom: 8px;
        font-size: 0.9rem;
        color: var(--text-muted);
      }
      .input-group input,
      .input-group select {
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #475569;
        background-color: var(--main-bg);
        color: white;
        outline: none;
      }
      .btn-primary {
        padding: 12px 25px;
        background-color: var(--accent);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        height: 45px;
        transition: 0.3s;
      }
      .btn-primary:hover {
        background-color: var(--accent-hover);
      }
      .btn-primary:disabled {
        background-color: #475569;
        cursor: not-allowed;
      }
      .full-width {
        grid-column: 1 / -1;
      }

      /* លាក់ប្រអប់ Store ជាបណ្ដោះអាសន្ន */
      .store-field {
        display: none;
      }

      /* Data Table */
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
      }
      th,
      td {
        padding: 15px;
        text-align: left;
        border-bottom: 1px solid #475569;
      }
      th {
        color: var(--text-muted);
        font-weight: 500;
      }
      .badge {
        padding: 5px 10px;
        border-radius: 20px;
        font-size: 0.8rem;
        font-weight: bold;
        text-transform: capitalize;
      }
      .badge.super_admin,
      .badge.admin {
        background-color: rgba(239, 68, 68, 0.2);
        color: var(--danger);
      }
      .badge.seller {
        background-color: rgba(16, 185, 129, 0.2);
        color: var(--success);
      }
      .badge.buyer {
        background-color: rgba(148, 163, 184, 0.2);
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <i class="fas fa-crown"></i> <span>Admin</span>Panel
      </div>
      <ul class="nav-menu">
        <li>
          <a href="#" class="active"
            ><i class="fas fa-chart-line"></i> Dashboard</a
          >
        </li>
        <li>
          <a href="#"><i class="fas fa-users"></i> Manage Users</a>
        </li>
        <li>
          <a href="#"><i class="fas fa-box"></i> All Products</a>
        </li>
        <li>
          <a href="#"><i class="fas fa-shopping-cart"></i> Orders</a>
        </li>
        <li>
          <a href="#"><i class="fas fa-cog"></i> Settings</a>
        </li>
      </ul>
      <button class="logout-btn" onclick="handleLogout()">
        <i class="fas fa-sign-out-alt"></i> Logout
      </button>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="header">
        <h1>Dashboard Overview</h1>
        <div class="admin-profile">
          <i class="fas fa-user-circle fa-2x text-muted"></i>
          <span id="admin-name">Loading...</span>
        </div>
      </header>

      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-users"></i></div>
          <div class="stat-info">
            <h3 id="stat-total-users">0</h3>
            <p>Total Users</p>
          </div>
        </div>
        <div class="stat-card">
          <div
            class="stat-icon"
            style="color: var(--success); background: rgba(16, 185, 129, 0.2)"
          >
            <i class="fas fa-store"></i>
          </div>
          <div class="stat-info">
            <h3 id="stat-total-sellers">0</h3>
            <p>Active Sellers</p>
          </div>
        </div>
        <div class="stat-card">
          <div
            class="stat-icon"
            style="color: #f59e0b; background: rgba(245, 158, 11, 0.2)"
          >
            <i class="fas fa-box-open"></i>
          </div>
          <div class="stat-info">
            <h3 id="stat-total-products">0</h3>
            <p>Total Products</p>
          </div>
        </div>
      </div>

      <!-- Create New System Account & Store -->
      <section class="action-section">
        <h2><i class="fas fa-user-plus"></i> Create System Account & Store</h2>
        <form id="createAccountForm" class="form-grid">
          <div class="input-group">
            <label>Username</label>
            <input
              type="text"
              id="new-username"
              required
              placeholder="Enter username"
            />
          </div>
          <div class="input-group">
            <label>Password</label>
            <input
              type="password"
              id="new-password"
              required
              placeholder="Enter password"
            />
          </div>
          <div class="input-group">
            <label>Role</label>
            <!-- ហៅ Function toggleStoreFields ពេលមានការផ្លាស់ប្តូរ Role -->
            <select id="new-role" onchange="toggleStoreFields()">
              <option value="seller">Seller</option>
              <option value="admin">Administrator</option>
              <option value="buyer">Buyer</option>
            </select>
          </div>

          <!-- ប្រអប់សម្រាប់ហាង (លោតចេញតែពេលរើស Seller ប៉ុណ្ណោះ) -->
          <div class="input-group store-field" id="store-name-group">
            <label>Store Name</label>
            <input type="text" id="store-name" placeholder="Enter store name" />
          </div>
          <div class="input-group store-field" id="store-category-group">
            <label>Store Category</label>
            <select id="store-category">
              <option value="Fashion">Fashion & Clothing</option>
              <option value="Shoes">Shoes & Sneakers</option>
              <option value="Accessories">Accessories</option>
              <option value="Beauty">Beauty & Cosmetics</option>
            </select>
          </div>

          <button type="submit" id="btn-create" class="btn-primary full-width">
            <i class="fas fa-plus"></i> Create Account
          </button>
        </form>
      </section>

      <!-- User List Table -->
      <section class="action-section">
        <h2><i class="fas fa-list"></i> System Users List</h2>
        <table>
          <thead>
            <tr>
              <th>Username</th>
              <th>Role</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="user-table-body">
            <tr>
              <td colspan="4" style="text-align: center">Loading users...</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>

    <script>
      // ==========================================
      // 1. កំណត់អថេរ និងពិនិត្យសិទ្ធិចូលប្រើ
      // ==========================================
      const API_BASE = "/api/admin"; // ដូរទៅតាម Route ពិតប្រាកដក្នុង Backend របស់បង
      const TOKEN = localStorage.getItem("token");
      const ROLE = localStorage.getItem("role");
      const USERNAME = localStorage.getItem("username");

      document.addEventListener("DOMContentLoaded", () => {
        // អនុញ្ញាតឱ្យតែ super_admin និង admin ប៉ុណ្ណោះ
        if (!TOKEN || (ROLE !== "admin" && ROLE !== "super_admin")) {
          Swal.fire({
            icon: "error",
            title: "Access Denied",
            text: "You do not have permission to view this page.",
            allowOutsideClick: false,
          }).then(() => {
            window.location.href = "admin-login.html";
          });
          return;
        }

        document.getElementById("admin-name").innerText = USERNAME;
        toggleStoreFields(); // បង្ហាញ ឬលាក់ប្រអប់ Store តាមការកំណត់ដើម (Default ជា Seller)
        loadDashboardData(); // ទាញទិន្នន័យពី API
      });

      // ==========================================
      // 2. មុខងារលាក់ ឬបង្ហាញប្រអប់បំពេញទិន្នន័យហាង
      // ==========================================
      function toggleStoreFields() {
        const role = document.getElementById("new-role").value;
        const storeGroups = document.querySelectorAll(".store-field");
        const storeNameInput = document.getElementById("store-name");

        if (role === "seller") {
          // បង្ហាញប្រអប់ និងបង្ខំឱ្យបំពេញ
          storeGroups.forEach((el) => (el.style.display = "flex"));
          storeNameInput.required = true;
        } else {
          // លាក់ប្រអប់ និងមិនបាច់បំពេញ
          storeGroups.forEach((el) => (el.style.display = "none"));
          storeNameInput.required = false;
          storeNameInput.value = "";
        }
      }

      // ==========================================
      // 3. ទាញទិន្នន័យពី MongoDB (Backend API)
      // ==========================================
      async function loadDashboardData() {
        try {
          const res = await fetch(`${API_BASE}/users`, {
            method: "GET",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${TOKEN}`,
            },
          });

          const data = await res.json();
          const users = data.users || data || [];

          // គណនាសរុប
          const totalUsers = users.length || 0;
          const totalSellers =
            users.filter((u) => u.role === "seller").length || 0;

          document.getElementById("stat-total-users").innerText = totalUsers;
          document.getElementById("stat-total-sellers").innerText =
            totalSellers;

          // បង្ហាញចូលក្នុង Table
          const tbody = document.getElementById("user-table-body");

          if (users.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align: center;">No users found in database</td></tr>`;
            return;
          }

          tbody.innerHTML = users
            .map(
              (u) => `
            <tr>
              <td>${u.username}</td>
              <td><span class="badge ${u.role}">${u.role}</span></td>
              <td>Active</td>
              <td>
                ${
                  u.username === USERNAME || u.role === "super_admin"
                    ? `<button disabled style="background:none;border:none;color:gray;cursor:not-allowed;" title="Cannot delete this user"><i class="fas fa-ban"></i></button>`
                    : `<button onclick="deleteUser('${u._id}', '${u.username}')" style="background:none;border:none;color:var(--danger);cursor:pointer;" title="Delete User"><i class="fas fa-trash"></i></button>`
                }
              </td>
            </tr>
          `,
            )
            .join("");
        } catch (error) {
          console.error("Error fetching users:", error);
          document.getElementById("user-table-body").innerHTML =
            `<tr><td colspan="4" style="text-align: center; color: red;">Failed to load data from server.</td></tr>`;
        }
      }

      // ==========================================
      // 4. បង្កើតគណនីថ្មី (និងហាងបើជារបស់ Seller)
      // ==========================================
      document
        .getElementById("createAccountForm")
        .addEventListener("submit", async function (event) {
          event.preventDefault();

          const usernameInput = document
            .getElementById("new-username")
            .value.trim();
          const passwordInput = document.getElementById("new-password").value;
          const roleInput = document.getElementById("new-role").value;

          // ទាញយកទិន្នន័យហាង (វាមានតម្លៃទាល់តែ Role ជា Seller)
          const storeNameInput = document
            .getElementById("store-name")
            .value.trim();
          const storeCategoryInput =
            document.getElementById("store-category").value;

          const btnCreate = document.getElementById("btn-create");
          btnCreate.disabled = true;
          btnCreate.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Creating...`;

          try {
            const res = await fetch(`${API_BASE}/users`, {
              // ឬបងប្រើ "/api/auth/register" អាស្រ័យលើ Backend
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${TOKEN}`,
              },
              body: JSON.stringify({
                username: usernameInput,
                password: passwordInput,
                role: roleInput,
                storeName: storeNameInput,
                storeCategory: storeCategoryInput,
              }),
            });

            const data = await res.json();

            if (res.ok) {
              Swal.fire(
                "Created!",
                `Account ${usernameInput} has been created successfully.`,
                "success",
              );
              document.getElementById("createAccountForm").reset();
              toggleStoreFields(); // តម្រូវប្រអប់ហាងឱ្យត្រូវតាមស្ថានភាពដើម
              loadDashboardData(); // Refresh table
            } else {
              Swal.fire(
                "Failed",
                data.message || "Could not create user!",
                "error",
              );
            }
          } catch (error) {
            Swal.fire("Error", "Server error. Could not connect.", "error");
          } finally {
            btnCreate.disabled = false;
            btnCreate.innerHTML = `<i class="fas fa-plus"></i> Create Account`;
          }
        });

      // ==========================================
      // 5. លុបគណនី
      // ==========================================
      function deleteUser(userId, username) {
        Swal.fire({
          title: `Delete ${username}?`,
          text: "This action will remove the user from the database permanently!",
          icon: "warning",
          showCancelButton: true,
          confirmButtonColor: "#ef4444",
          cancelButtonColor: "#94a3b8",
          confirmButtonText: "Yes, delete",
        }).then(async (result) => {
          if (result.isConfirmed) {
            try {
              const res = await fetch(`${API_BASE}/users/${userId}`, {
                method: "DELETE",
                headers: {
                  Authorization: `Bearer ${TOKEN}`,
                },
              });

              if (res.ok) {
                Swal.fire("Deleted!", "User has been removed.", "success");
                loadDashboardData(); // Refresh table
              } else {
                const data = await res.json();
                Swal.fire(
                  "Failed!",
                  data.message || "Could not delete user.",
                  "error",
                );
              }
            } catch (error) {
              Swal.fire("Error", "Failed to communicate with server.", "error");
            }
          }
        });
      }

      // ==========================================
      // 6. មុខងារ Logout
      // ==========================================
      function handleLogout() {
        Swal.fire({
          title: "Are you sure?",
          text: "You will be logged out of the admin panel.",
          icon: "warning",
          showCancelButton: true,
          confirmButtonColor: "#0284c7",
          cancelButtonColor: "#ef4444",
          confirmButtonText: "Yes, logout!",
        }).then((result) => {
          if (result.isConfirmed) {
            localStorage.clear(); // លុបទិន្នន័យ (Token, Role) ចេញទាំងអស់
            window.location.href = "admin-login.html";
          }
        });
      }
    </script>
  </body>
</html>
