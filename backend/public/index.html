<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fashion Shop | Multi-Vendor Marketplace</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <style>
      :root {
        --primary: #4f46e5;
        --primary-hover: #4338ca;
        --accent: #f97316;
        --bg-main: #f9fafb;
        --text-dark: #1f2937;
        --text-muted: #6b7280;
        --border: #e5e7eb;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "DM Sans", sans-serif;
      }
      body {
        background-color: var(--bg-main);
        color: var(--text-dark);
      }

      /* Navbar */
      .navbar {
        background: white;
        padding: 15px 50px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 100;
      }
      .logo {
        font-size: 1.8rem;
        font-weight: 700;
        color: var(--primary);
        text-decoration: none;
      }
      .logo span {
        color: var(--accent);
      }

      .search-bar {
        flex: 1;
        max-width: 500px;
        display: flex;
        margin: 0 20px;
      }
      .search-bar input {
        width: 100%;
        padding: 10px 15px;
        border: 1px solid var(--border);
        border-radius: 20px 0 0 20px;
        outline: none;
      }
      .search-bar button {
        padding: 10px 20px;
        border: none;
        background: var(--primary);
        color: white;
        border-radius: 0 20px 20px 0;
        cursor: pointer;
      }

      .nav-icons {
        display: flex;
        align-items: center;
        gap: 25px;
      }
      .nav-icons i {
        font-size: 1.4rem;
        color: var(--text-dark);
        cursor: pointer;
        transition: 0.3s;
      }
      .nav-icons i:hover {
        color: var(--primary);
      }
      .cart-icon {
        position: relative;
      }
      .cart-badge {
        position: absolute;
        top: -8px;
        right: -8px;
        background: var(--accent);
        color: white;
        font-size: 0.7rem;
        padding: 2px 6px;
        border-radius: 50%;
        font-weight: bold;
      }

      /* Hero Section */
      .hero {
        background: linear-gradient(
          135deg,
          rgba(79, 70, 229, 0.1) 0%,
          rgba(249, 115, 22, 0.1) 100%
        );
        text-align: center;
        padding: 60px 20px;
      }
      .hero h1 {
        font-size: 2.5rem;
        margin-bottom: 10px;
      }
      .hero p {
        color: var(--text-muted);
        font-size: 1.1rem;
      }

      /* Products Grid */
      .container {
        max-width: 1200px;
        margin: 40px auto;
        padding: 0 20px;
      }
      .section-title {
        font-size: 1.5rem;
        margin-bottom: 20px;
      }
      .product-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 25px;
      }

      .product-card {
        background: white;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid var(--border);
        transition: 0.3s;
      }
      .product-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 15px rgba(0, 0, 0, 0.05);
      }
      .product-img {
        width: 100%;
        height: 250px;
        object-fit: cover;
      }
      .product-info {
        padding: 15px;
      }
      .store-name {
        font-size: 0.8rem;
        color: var(--text-muted);
        margin-bottom: 5px;
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .product-title {
        font-size: 1.1rem;
        font-weight: 600;
        margin-bottom: 10px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .product-bottom {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .price {
        font-size: 1.2rem;
        font-weight: 700;
        color: var(--primary);
      }
      .btn-add-cart {
        background: var(--accent);
        color: white;
        border: none;
        padding: 8px 15px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.3s;
      }
      .btn-add-cart:hover {
        background: #ea580c;
      }
    </style>
  </head>
  <body>
    <!-- Navigation -->
    <nav class="navbar">
      <a href="#" class="logo">Fashion<span>Shop</span></a>

      <div class="search-bar">
        <input
          type="text"
          placeholder="Search for products, brands and more..."
        />
        <button><i class="fas fa-search"></i></button>
      </div>

      <div class="nav-icons">
        <div
          class="cart-icon"
          onclick="alert('មុខងារកន្ត្រកទំនិញនឹងមកដល់ឆាប់ៗនេះ!')"
        >
          <i class="fas fa-shopping-cart"></i>
          <span class="cart-badge" id="cart-count">0</span>
        </div>
        <i
          class="fas fa-user-circle"
          title="Login/Register"
          onclick="window.location.href = 'admin-login.html'"
        ></i>
      </div>
    </nav>

    <!-- Hero Banner -->
    <section class="hero">
      <h1>Discover Amazing Products</h1>
      <p>Shop from hundreds of stores in one single platform.</p>
    </section>

    <!-- Products Section -->
    <main class="container">
      <h2 class="section-title">Just For You</h2>

      <div class="product-grid" id="product-container">
        <!-- Products will be injected here by JavaScript -->
        <p style="text-align: center; width: 100%; color: var(--text-muted)">
          Loading amazing products...
        </p>
      </div>
    </main>

    <script>
      const API_BASE_PUBLIC = "/api/public";
      let cart = []; // តួអង្គតំណាងអោយកន្ត្រកទំនិញ (Shopping Cart)

      document.addEventListener("DOMContentLoaded", () => {
        fetchProducts();
      });

      // ទាញយកផលិតផលពី Backend មកបង្ហាញ
      async function fetchProducts() {
        const container = document.getElementById("product-container");
        try {
          const res = await fetch(`${API_BASE_PUBLIC}/products`);
          const data = await res.json();

          if (data.products && data.products.length > 0) {
            renderProducts(data.products);
          } else {
            container.innerHTML = `<p style="text-align: center; width: 100%;">No products available right now. Please come back later!</p>`;
          }
        } catch (error) {
          console.error("Error fetching products:", error);
          container.innerHTML = `<p style="text-align: center; width: 100%; color: red;">Failed to load products. Please check your connection.</p>`;
        }
      }

      function renderProducts(products) {
        const container = document.getElementById("product-container");
        container.innerHTML = products
          .map(
            (p) => `
          <div class="product-card">
            <img src="${p.imageUrl || "https://via.placeholder.com/300"}" alt="${p.name}" class="product-img" onerror="this.src='https://via.placeholder.com/300'">
            <div class="product-info">
              <div class="store-name">
                <i class="fas fa-store"></i> ${p.store?.storeName || "Unknown Store"}
              </div>
              <h3 class="product-title" title="${p.name}">${p.name}</h3>
              <div class="product-bottom">
                <span class="price">$${p.price.toFixed(2)}</span>
                <button class="btn-add-cart" onclick="addToCart('${p._id}', '${p.name}', ${p.price}, '${p.store?._id}')">
                  <i class="fas fa-plus"></i> Add
                </button>
              </div>
            </div>
          </div>
        `,
          )
          .join("");
      }

      // មុខងារបញ្ចូលអីវ៉ាន់ទៅក្នុងកន្ត្រក (Cart Logic)
      function addToCart(productId, name, price, storeId) {
        // ឆែកថាតើមានអីវ៉ាន់នេះក្នុងកន្ត្រកឬនៅ?
        const existingItem = cart.find((item) => item.productId === productId);

        if (existingItem) {
          existingItem.qty += 1;
        } else {
          cart.push({ productId, name, price, storeId, qty: 1 });
        }

        // Update តួលេខលើកន្ត្រក
        const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
        document.getElementById("cart-count").innerText = totalItems;

        // បញ្ចេញ Animation អោយស្អាត
        const badge = document.getElementById("cart-count");
        badge.style.transform = "scale(1.5)";
        setTimeout(() => (badge.style.transform = "scale(1)"), 200);
      }
    </script>
  </body>
</html>
