<!doctype html>
<html lang="km">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>U-Mall - ផ្សារអនឡាញរបស់អ្នក</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Kantumruy Pro", sans-serif;
        background-color: #f5f5f5;
      }
      .line-clamp-2 {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Product Card Hover Effect */
      .product-card:hover .add-to-cart-btn {
        opacity: 1;
        transform: translateY(0);
      }
      .add-to-cart-btn {
        opacity: 0;
        transform: translateY(10px);
        transition: all 0.3s ease;
      }

      /* Cart Animation */
      #cart-count {
        transition: transform 0.2s ease-in-out;
      }
    </style>
  </head>
  <body class="text-gray-800 antialiased">
    <!-- 🌟 ១. Smart Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
      <div class="bg-blue-600 text-white text-xs py-1">
        <div class="max-w-7xl mx-auto px-4 flex justify-between">
          <div class="flex space-x-4">
            <span
              ><i class="fas fa-bullhorn mr-1"></i> ក្លាយជាអ្នកលក់នៅលើ
              U-Mall</span
            >
          </div>
          <div class="flex space-x-4">
            <a href="#" class="hover:text-gray-200">ជំនួយ</a>
            <a href="#" class="hover:text-gray-200">ភាសាខ្មែរ</a>
          </div>
        </div>
      </div>

      <div
        class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between"
      >
        <a href="/" class="flex items-center space-x-2 w-1/4">
          <div
            class="bg-blue-600 text-white p-2 rounded-lg font-bold text-2xl leading-none"
          >
            U
          </div>
          <span class="text-2xl font-bold text-blue-600 tracking-tight"
            >Mall</span
          >
        </a>

        <div class="w-2/4 px-4">
          <div class="relative flex w-full">
            <input
              type="text"
              id="search-input"
              class="w-full border-2 border-blue-600 rounded-l-lg py-2 px-4 focus:outline-none"
              placeholder="ស្វែងរកអីវ៉ាន់នៅទីនេះ..."
            />
            <button
              class="bg-blue-600 text-white px-6 rounded-r-lg hover:bg-blue-700 transition"
            >
              <i class="fas fa-search"></i>
            </button>
          </div>
        </div>

        <div class="w-1/4 flex justify-end items-center space-x-6">
          <!-- 🛒 កន្ត្រកទំនិញ (ភ្ជាប់ ID សម្រាប់ JS) -->
          <a
            href="#"
            onclick="alert('មុខងារកន្ត្រកទំនិញនឹងមកដល់ឆាប់ៗនេះ!')"
            class="relative text-gray-600 hover:text-blue-600 transition"
          >
            <i class="fas fa-shopping-cart text-2xl"></i>
            <span
              id="cart-count"
              class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center border-2 border-white"
              >0</span
            >
          </a>
          <div class="border-l pl-6 flex space-x-3">
            <a
              href="admin-login.html"
              class="text-sm font-medium text-white bg-blue-600 px-4 py-1.5 rounded-md hover:bg-blue-700 shadow-sm transition"
              >ចូលគណនីហាង</a
            >
          </div>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 space-y-8">
      <!-- 🖼️ ២. Hero Banner & Flash Sale (នៅរក្សាទុកសិនចាំ Admin ប្ដូរ) -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 h-[350px]">
        <div
          class="md:col-span-2 bg-gray-200 rounded-xl overflow-hidden relative shadow-sm"
        >
          <img
            src="https://via.placeholder.com/800x400/2563eb/ffffff?text=U-Mall+Mega+Sale"
            class="w-full h-full object-cover"
          />
        </div>
        <div class="flex flex-col gap-4">
          <div class="flex-1 bg-gray-200 rounded-xl overflow-hidden shadow-sm">
            <img
              src="https://via.placeholder.com/400x190/ef4444/ffffff?text=Free+Delivery"
              class="w-full h-full object-cover"
            />
          </div>
          <div class="flex-1 bg-gray-200 rounded-xl overflow-hidden shadow-sm">
            <img
              src="https://via.placeholder.com/400x190/10b981/ffffff?text=New+Arrivals"
              class="w-full h-full object-cover"
            />
          </div>
        </div>
      </div>

      <!-- 🛍️ ៥. Daily Discover (កន្លែងបាញ់ទិន្នន័យពិត) -->
      <div>
        <div
          class="bg-white rounded-t-xl border-b-2 border-blue-600 inline-block px-6 py-3 mb-4"
        >
          <h2 class="text-xl font-bold text-blue-600">ទំនិញសម្រាប់អ្នក</h2>
        </div>

        <!-- នេះជា Grid ដែល JS នឹងចាក់ទិន្នន័យចូល -->
        <div class="grid grid-cols-2 md:grid-cols-5 gap-3" id="products-grid">
          <div class="col-span-full text-center py-10 text-gray-500">
            <i class="fas fa-spinner fa-spin text-2xl mb-2 text-blue-600"></i
            ><br />
            កំពុងទាញយកទំនិញពិតពីប្រព័ន្ធ...
          </div>
        </div>
      </div>
    </main>

    <script>
      // ----------------------------------------------------
      // Logic ទាញយកទិន្នន័យពី Backend ដែលបងបានសរសេរ
      // ----------------------------------------------------
      const API_BASE_PUBLIC = "/api/public";
      let cart = []; // តួអង្គកន្ត្រកទំនិញ

      document.addEventListener("DOMContentLoaded", () => {
        fetchProducts();
      });

      // ១. ទាញទិន្នន័យពិត
      async function fetchProducts() {
        const container = document.getElementById("products-grid");
        try {
          const res = await fetch(`${API_BASE_PUBLIC}/products`);
          const data = await res.json();

          if (data.products && data.products.length > 0) {
            renderProducts(data.products);
          } else {
            container.innerHTML = `<div class="col-span-full text-center py-10 text-gray-500">មិនទាន់មានផលិតផលដាក់លក់នៅឡើយទេ។</div>`;
          }
        } catch (error) {
          console.error("Error fetching products:", error);
          container.innerHTML = `<div class="col-span-full text-center py-10 text-red-500">បរាជ័យក្នុងការទាញយកទិន្នន័យ។ សូមពិនិត្យអ៊ិនធឺណិតរបស់អ្នក!</div>`;
        }
      }

      // ២. បញ្ចេញទិន្នន័យក្នុងទម្រង់ UI ថ្មី (U-Mall Card)
      function renderProducts(products) {
        const container = document.getElementById("products-grid");
        container.innerHTML = products
          .map((p) => {
            // ការពារកុំឱ្យបញ្ហាសញ្ញា (') ពេលបញ្ជូនឈ្មោះទំនិញទៅក្នុង Function addToCart
            const safeName = p.name ? p.name.replace(/'/g, "\\'") : "Unknown";
            const storeName = p.store?.storeName
              ? p.store.storeName
              : "U-Mall Official";
            const image = p.imageUrl || "https://via.placeholder.com/200";

            return `
                <div class="product-card bg-white rounded-lg shadow-sm hover:shadow-xl transition-all duration-300 border border-gray-100 overflow-hidden relative cursor-pointer flex flex-col h-full">
                    <img src="${image}" alt="Product" class="w-full h-48 object-cover" onerror="this.src='https://via.placeholder.com/200'">
                    
                    <div class="p-3 flex-1 flex flex-col">
                        <h3 class="text-sm text-gray-700 line-clamp-2 leading-snug mb-2" title="${p.name}">${p.name}</h3>
                        <div class="mt-auto">
                            <div class="text-lg font-bold text-blue-600 mb-1">$${p.price.toFixed(2)}</div>
                            <div class="flex justify-between items-center text-xs text-gray-500">
                                <div><i class="fas fa-star text-yellow-400"></i> 5.0</div>
                                <div><i class="fas fa-box-open"></i> ថ្មី</div>
                            </div>
                            <div class="text-[10px] text-gray-400 mt-2 border-t pt-1">
                                <i class="fas fa-store text-blue-500"></i> ${storeName}
                            </div>
                        </div>
                    </div>
                    
                    <!-- ប៊ូតុង Add to Cart បែប Hover -->
                    <div class="absolute bottom-0 left-0 w-full p-2 add-to-cart-btn bg-white bg-opacity-95">
                        <button onclick="addToCart('${p._id}', '${safeName}', ${p.price}, '${p.store?._id}')" class="w-full bg-blue-600 text-white py-2 rounded shadow hover:bg-blue-700 text-sm font-medium transition flex items-center justify-center gap-2">
                            <i class="fas fa-cart-plus"></i> បញ្ចូលកន្ត្រក
                        </button>
                    </div>
                </div>
                `;
          })
          .join("");
      }

      // ៣. បញ្ចូលអីវ៉ាន់ទៅកន្ត្រក និងលោត Animation
      function addToCart(productId, name, price, storeId) {
        const existingItem = cart.find((item) => item.productId === productId);

        if (existingItem) {
          existingItem.qty += 1;
        } else {
          cart.push({ productId, name, price, storeId, qty: 1 });
        }

        // Update លេខនៅលើ Badge កន្ត្រកខាងលើ
        const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
        const badge = document.getElementById("cart-count");
        badge.innerText = totalItems;

        // បញ្ចេញ Animation អោយកន្ត្រកលោតឌឹបៗ
        badge.style.transform = "scale(1.5)";
        setTimeout(() => (badge.style.transform = "scale(1)"), 200);
      }
    </script>
  </body>
</html>
