<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Portal | Fashion Shop</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "DM Sans", sans-serif;
      }
      body {
        background-color: #1e293b;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden; /* ការពារកុំឱ្យមាន Scrollbar លោតចុះឡើង */
        color: #fff;
      }
      .admin-login-card {
        background: #0f172a;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        width: 100%;
        max-width: 400px;
        border: 1px solid #334155;
        text-align: center;
      }
      .admin-login-card h2 {
        margin-bottom: 5px;
        color: #38bdf8;
      }
      .admin-login-card p {
        color: #94a3b8;
        font-size: 0.9rem;
        margin-bottom: 25px;
      }
      .input-group {
        text-align: left;
        margin-bottom: 20px;
      }
      .input-group label {
        display: block;
        font-size: 0.9rem;
        color: #cbd5e1;
        margin-bottom: 8px;
      }
      .input-group input {
        width: 100%;
        padding: 12px;
        background: #1e293b;
        border: 1px solid #475569;
        border-radius: 6px;
        color: #fff;
        font-size: 1rem;
        outline: none;
        transition: 0.3s;
      }
      .input-group input:focus {
        border-color: #38bdf8;
      }
      .btn-login {
        width: 100%;
        padding: 14px;
        background: #0284c7;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
      }
      .btn-login:hover {
        background: #0369a1;
      }
      .btn-login:disabled {
        background: #475569;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div class="admin-login-card">
      <h2>Admin Portal</h2>
      <p>Restricted Access - Authorized Personnel Only</p>

      <!-- លុប onsubmit ចេញពី HTML ប្រើប្រាស់ id ជំនួសវិញ -->
      <form id="admin-login-form">
        <div class="input-group">
          <label>Admin Username</label>
          <input
            type="text"
            id="admin-user"
            required
            placeholder="Enter username"
            autocomplete="username"
          />
        </div>
        <div class="input-group">
          <label>Password</label>
          <input
            type="password"
            id="admin-pass"
            required
            placeholder="Enter password"
            autocomplete="current-password"
          />
        </div>
        <button type="submit" id="submit-btn" class="btn-login">
          Login to Dashboard
        </button>
      </form>
    </div>

    <script>
      // ដោយសារ Frontend និង Backend នៅជាមួយគ្នា យើងអាចប្រើ Path ខ្លីបែបនេះបាន
      const API_URL = "/api/auth";

      // ចាប់យក Form តាមរយៈ ID
      const loginForm = document.getElementById("admin-login-form");
      const submitBtn = document.getElementById("submit-btn");

      // ប្រើ addEventListener ដើម្បីធានាថា preventDefault ដំណើរការបាន ១០០%
      loginForm.addEventListener("submit", async function (event) {
        event.preventDefault(); // ទប់កុំឱ្យ Page លោត ឬ Refresh ដាច់ខាត

        const username = document.getElementById("admin-user").value.trim();
        const password = document.getElementById("admin-pass").value;

        // ដូរ UI ប៊ូតុងពេលកំពុងរង់ចាំ
        submitBtn.disabled = true;
        submitBtn.textContent = "Logging in...";

        try {
          const res = await fetch(`${API_URL}/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });
          const data = await res.json();

          if (data.success) {
            // ទាញយក Role របស់អ្នកប្រើប្រាស់
            const userRole = data.role || (data.user && data.user.role);

            // ឆែកសិទ្ធិ: អនុញ្ញាតឱ្យតែ super_admin, admin និង seller ប៉ុណ្ណោះ
            if (
              userRole !== "super_admin" &&
              userRole !== "admin" &&
              userRole !== "seller"
            ) {
              submitBtn.disabled = false;
              submitBtn.textContent = "Login to Dashboard";
              return Swal.fire({
                icon: "error",
                title: "Access Denied",
                text: "You do not have administrative privileges!",
                confirmButtonColor: "#0284c7",
              });
            }

            // រក្សាទុក Token និងទិន្នន័យចាំបាច់
            localStorage.setItem("token", data.token);
            localStorage.setItem(
              "username",
              data.username || (data.user && data.user.username),
            );
            localStorage.setItem("role", userRole);

            Swal.fire({
              icon: "success",
              title: "Welcome Back",
              text: "Redirecting to Dashboard...",
              showConfirmButton: false,
              timer: 1500,
            }).then(() => {
              // បញ្ជូនទៅកាន់ទំព័រទៅតាម Role
              if (userRole === "super_admin" || userRole === "admin") {
                window.location.href = "admin.html";
              } else if (userRole === "seller") {
                window.location.href = "seller-inventory.html";
              }
            });
          } else {
            // បើ Login ខុស
            submitBtn.disabled = false;
            submitBtn.textContent = "Login to Dashboard";
            Swal.fire({
              icon: "error",
              title: "Login Failed",
              text: data.message || "Invalid username or password!",
              confirmButtonColor: "#0284c7",
            });
          }
        } catch (error) {
          submitBtn.disabled = false;
          submitBtn.textContent = "Login to Dashboard";
          Swal.fire({
            icon: "error",
            title: "Connection Error",
            text: "Cannot connect to server. Please try again.",
            confirmButtonColor: "#0284c7",
          });
        }
      });
    </script>
  </body>
</html>
