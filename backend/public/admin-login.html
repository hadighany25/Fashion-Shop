<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | U-Mall Control Panel</title>

    <!-- 📌 Font Kantumruy Pro -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Icons & Alert -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
      /* ==========================================
           🎨 Theme & CSS Variables (ស៊ីគ្នាជាមួយ Admin)
           ========================================== */
      :root {
        --bg-body: #0f172a;
        --bg-card: #1e293b;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --border-color: #475569;
        --accent: #0284c7;
        --accent-hover: #0369a1;
        --danger: #ef4444;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: var(--bg-body);
        color: var(--text-main);
        font-family: "Kantumruy Pro", sans-serif;
        overflow: hidden;
      }

      /* ផ្ទាំង Login */
      .login-container {
        width: 100%;
        max-width: 420px;
        padding: 20px;
        animation: fadeIn 0.5s ease-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .login-card {
        background-color: var(--bg-card);
        padding: 40px 30px;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        border: 1px solid var(--border-color);
        text-align: center;
      }

      .logo {
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 10px;
        color: var(--text-main);
      }

      .logo span {
        color: var(--accent);
      }

      .subtitle {
        color: var(--text-muted);
        margin-bottom: 30px;
        font-size: 0.95rem;
      }

      /* Form Elements */
      .input-group {
        display: flex;
        flex-direction: column;
        text-align: left;
        margin-bottom: 20px;
      }

      .input-group label {
        margin-bottom: 8px;
        font-size: 0.95rem;
        font-weight: 500;
        color: var(--text-main);
      }

      .input-group input {
        padding: 14px;
        border-radius: 8px;
        border: 1px solid var(--border-color);
        background-color: var(--bg-body);
        color: var(--text-main);
        outline: none;
        font-family: "Kantumruy Pro", sans-serif;
        font-size: 1rem;
        transition: 0.3s;
      }

      .input-group input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.2);
      }

      .btn-primary {
        width: 100%;
        padding: 14px;
        background-color: var(--accent);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        font-size: 1.1rem;
        font-family: "Kantumruy Pro", sans-serif;
        transition: 0.3s;
        margin-top: 10px;
      }

      .btn-primary:hover {
        background-color: var(--accent-hover);
      }

      .btn-primary:disabled {
        background-color: var(--border-color);
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-card">
        <div class="logo">
          <i class="fas fa-crown"></i> <span>U-Mall</span> Admin
        </div>
        <p class="subtitle">
          សូមស្វាគមន៍មកកាន់ប្រព័ន្ធគ្រប់គ្រង (Control Panel)
        </p>

        <form id="loginForm">
          <div class="input-group">
            <label><i class="fas fa-user"></i> ឈ្មោះគណនី (Username)</label>
            <input
              type="text"
              id="username"
              required
              placeholder="បញ្ចូលឈ្មោះគណនីរបស់អ្នក..."
              autocomplete="username"
            />
          </div>

          <div class="input-group">
            <label><i class="fas fa-lock"></i> លេខសម្ងាត់ (Password)</label>
            <input
              type="password"
              id="password"
              required
              placeholder="បញ្ចូលលេខសម្ងាត់..."
              autocomplete="current-password"
            />
          </div>

          <button type="submit" class="btn-primary" id="loginBtn">
            <i class="fas fa-sign-in-alt"></i> ចូលប្រព័ន្ធ (Login)
          </button>
        </form>
      </div>
    </div>

    <script>
      // ==========================================
      // 🔒 ពិនិត្យមើលសិទ្ធិ (ការពារមិនបាច់អោយ Login ម្ដងទៀតបើធ្លាប់ Login ហើយ)
      // ==========================================
      document.addEventListener("DOMContentLoaded", () => {
        const token = localStorage.getItem("token");
        const role = localStorage.getItem("role");

        // បើមាន Token ហើយមាន Role ជា Admin ឬ Super Admin លោតទៅ admin.html ហ្មង
        if (token && (role === "admin" || role === "super_admin")) {
          window.location.href = "admin.html";
        }
      });

      // ==========================================
      // 🚀 ដំណើរការផ្ទៀងផ្ទាត់ពេលចុច Login
      // ==========================================
      document
        .getElementById("loginForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const usernameInput = document
            .getElementById("username")
            .value.trim();
          const passwordInput = document.getElementById("password").value;
          const loginBtn = document.getElementById("loginBtn");

          // ប្ដូរប៊ូតុងអោយចេញជារាងវិលៗពេលកំពុង Process
          loginBtn.disabled = true;
          loginBtn.innerHTML =
            '<i class="fas fa-spinner fa-spin"></i> កំពុងផ្ទៀងផ្ទាត់...';

          try {
            // ចំណាំ៖ បងអាចកែ URL "/api/admin/login" នេះទៅតាម Route ពិតក្នុង Backend របស់បង
            const response = await fetch("/api/admin/login", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                username: usernameInput,
                password: passwordInput,
              }),
            });

            const data = await response.json();

            if (response.ok) {
              // ប្រសិនបើ Login ជោគជ័យ ត្រូវ Save ទុកក្នុង localStorage
              localStorage.setItem("token", data.token);
              localStorage.setItem("role", data.user.role);
              localStorage.setItem("username", data.user.username);

              // បង្ហាញសារជោគជ័យ រួចបោះទៅ admin.html
              Swal.fire({
                icon: "success",
                title: "ចូលប្រព័ន្ធជោគជ័យ!",
                text: "កំពុងនាំអ្នកទៅកាន់ទំព័រគ្រប់គ្រង...",
                timer: 1500,
                showConfirmButton: false,
              }).then(() => {
                window.location.href = "admin.html";
              });
            } else {
              // បើខុស Password ឬ អត់មានគណនី
              Swal.fire(
                "បរាជ័យ",
                data.message || "ឈ្មោះគណនី ឬលេខសម្ងាត់មិនត្រឹមត្រូវទេ!",
                "error",
              );
            }
          } catch (error) {
            console.error("Login Error:", error);
            Swal.fire(
              "កំហុស",
              "មិនអាចភ្ជាប់ទៅកាន់ Server បានទេ! សូមពិនិត្យ Network របស់អ្នក។",
              "error",
            );
          } finally {
            // ទោះខុស ឬត្រូវ ក៏ត្រូវបើកប៊ូតុងអោយគេចុចវិញដែរ
            loginBtn.disabled = false;
            loginBtn.innerHTML =
              '<i class="fas fa-sign-in-alt"></i> ចូលប្រព័ន្ធ (Login)';
          }
        });
    </script>
  </body>
</html>
