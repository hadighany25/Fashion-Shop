<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Portal | Fashion Shop</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "DM Sans", sans-serif;
      }
      body {
        background-color: #1e293b; /* Dark theme for Admin */
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: #fff;
      }
      .admin-login-card {
        background: #0f172a;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        width: 100%;
        max-width: 400px;
        border: 1px solid #334155;
        text-align: center;
      }
      .admin-login-card h2 {
        margin-bottom: 5px;
        color: #38bdf8;
      }
      .admin-login-card p {
        color: #94a3b8;
        font-size: 0.9rem;
        margin-bottom: 25px;
      }
      .input-group {
        text-align: left;
        margin-bottom: 20px;
      }
      .input-group label {
        display: block;
        font-size: 0.9rem;
        color: #cbd5e1;
        margin-bottom: 8px;
      }
      .input-group input {
        width: 100%;
        padding: 12px;
        background: #1e293b;
        border: 1px solid #475569;
        border-radius: 6px;
        color: #fff;
        font-size: 1rem;
        outline: none;
      }
      .input-group input:focus {
        border-color: #38bdf8;
      }
      .btn-login {
        width: 100%;
        padding: 14px;
        background: #0284c7;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
      }
      .btn-login:hover {
        background: #0369a1;
      }
    </style>
  </head>
  <body>
    <div class="admin-login-card">
      <h2>Admin Portal</h2>
      <p>Restricted Access - Authorized Personnel Only</p>

      <form
        onsubmit="
          event.preventDefault();
          handleAdminLogin();
        "
      >
        <div class="input-group">
          <label>Admin Username</label>
          <input
            type="text"
            id="admin-user"
            required
            placeholder="Enter username"
          />
        </div>
        <div class="input-group">
          <label>Password</label>
          <input
            type="password"
            id="admin-pass"
            required
            placeholder="Enter password"
          />
        </div>
        <button type="submit" class="btn-login">Login to Dashboard</button>
      </form>
    </div>

    <script>
      const API_URL = "/api/auth";

      async function handleAdminLogin() {
        const username = document.getElementById("admin-user").value.trim();
        const password = document.getElementById("admin-pass").value;

        try {
          const res = await fetch(`${API_URL}/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });
          const data = await res.json();

          if (data.success) {
            // Block normal buyers from logging in here
            if (data.role !== "admin" && data.role !== "seller") {
              return Swal.fire({
                icon: "error",
                title: "Access Denied",
                text: "You do not have administrative privileges!",
                confirmButtonColor: "#0284c7",
              });
            }

            // Save tokens for admin/seller
            localStorage.setItem("token", data.token);
            localStorage.setItem("username", data.username);
            localStorage.setItem("role", data.role);

            Swal.fire({
              icon: "success",
              title: "Welcome Back",
              text: "Redirecting to Dashboard...",
              showConfirmButton: false,
              timer: 1500,
            }).then(() => {
              // Correctly route based on role
              if (data.role === "admin") {
                window.location.href = "admin.html";
              } else if (data.role === "seller") {
                window.location.href = "seller-inventory.html";
              }
            });
          } else {
            Swal.fire({
              icon: "error",
              title: "Login Failed",
              text: data.message || "Invalid username or password!",
              confirmButtonColor: "#0284c7",
            });
          }
        } catch (error) {
          Swal.fire({
            icon: "error",
            title: "Connection Error",
            text: "Cannot connect to server.",
            confirmButtonColor: "#0284c7",
          });
        }
      }
    </script>
  </body>
</html>
